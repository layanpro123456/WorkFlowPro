# Initial local PostgreSQL service only. API and frontend services are added in deployment phase.
services:
  db:
    image: postgres:17-alpine
    container_name: workflowpro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflowpro}
      POSTGRES_USER: ${POSTGRES_USER:-workflowpro_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workflowpro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflowpro_app} -d ${POSTGRES_DB:-workflowpro}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workflowpro-postgres-data:
