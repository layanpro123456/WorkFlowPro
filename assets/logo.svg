<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="160" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.95" />
    </linearGradient>

    <!-- Logo icon gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners and subtle border -->
  <rect x="2" y="2" width="756" height="156" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Background decorative circuit/grid accents -->
  <circle cx="680" cy="40" r="80" fill="#6366F1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="120" r="60" fill="#EC4899" opacity="0.07" filter="url(#glow)"/>
  
  <g transform="translate(48, 28)">
    <!-- Hexagonal Workflow Geometric Mark -->
    <!-- Node connections / Circuit paths -->
    <path d="M 52 14 L 88 35 L 88 77 L 52 98 L 16 77 L 16 35 Z" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-dasharray="4 2" opacity="0.6"/>
    
    <!-- Flow Curves & Arrows -->
    <path d="M 16 35 C 32 10, 72 10, 88 35 C 104 60, 68 85, 52 98 C 36 85, 0 60, 16 35 Z" fill="url(#brandGrad)" fill-opacity="0.15" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <path d="M 30 52 L 52 38 L 74 52 L 52 76 Z" fill="url(#cyanGrad)" fill-opacity="0.25" stroke="url(#cyanGrad)" stroke-width="2.5" />
    
    <!-- Node Dots -->
    <circle cx="52" cy="14" r="6" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="88" cy="35" r="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="88" cy="77" r="5" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="52" cy="98" r="6" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="16" cy="77" r="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="16" cy="35" r="5" fill="#6366F1" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Central Spark -->
    <circle cx="52" cy="56" r="4.5" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Typography: WorkFlowPro -->
  <g transform="translate(180, 75)">
    <!-- WorkFlow -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-1" fill="url(#textGrad)">
      WorkFlow
    </text>
    
    <!-- Pro Badge / Text -->
    <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5" fill="url(#proGrad)">
      Pro
    </text>

    <!-- Enterprise Badge Tag -->
    <rect x="300" y="-34" width="102" height="24" rx="12" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1"/>
    <text x="351" y="-18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1" fill="#A5B4FC" text-anchor="middle">
      ENTERPRISE
    </text>

    <!-- Subtitle / Platform Mission -->
    <text x="2" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#94A3B8" letter-spacing="0.2">
      Projects • Kanban Workflows • Service Desk • Multi-Step Approvals
    </text>
  </g>

  <!-- Status / Build Pill on the right -->
  <g transform="translate(615, 62)">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#10B981" filter="url(#glow)"/>
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">
      v1.0 Ready
    </text>
  </g>
</svg>
