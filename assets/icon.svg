<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="iconBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#iconBg)" stroke="#334155" stroke-width="2"/>

  <!-- Geometric Workflow Loop -->
  <g transform="translate(12, 12)">
    <!-- Circuit lines -->
    <path d="M 52 14 L 88 35 L 88 77 L 52 98 L 16 77 L 16 35 Z" fill="none" stroke="url(#iconBrand)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6"/>
    
    <!-- Flow loop -->
    <path d="M 16 35 C 32 10, 72 10, 88 35 C 104 60, 68 85, 52 98 C 36 85, 0 60, 16 35 Z" fill="url(#iconBrand)" fill-opacity="0.2" stroke="url(#iconBrand)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner diamond -->
    <path d="M 32 53 L 52 40 L 72 53 L 52 74 Z" fill="url(#iconCyan)" fill-opacity="0.3" stroke="url(#iconCyan)" stroke-width="2.5" />

    <!-- Nodes -->
    <circle cx="52" cy="14" r="5.5" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" filter="url(#iconGlow)"/>
    <circle cx="88" cy="35" r="4.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="88" cy="77" r="4.5" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="52" cy="98" r="5.5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" filter="url(#iconGlow)"/>
    <circle cx="16" cy="77" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="16" cy="35" r="4.5" fill="#6366F1" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Center Pulse -->
    <circle cx="52" cy="54" r="4" fill="#FFFFFF" filter="url(#iconGlow)"/>
  </g>
</svg>
