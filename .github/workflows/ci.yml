name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/WorkFlowPro.sln

      - name: Build solution
        run: dotnet build backend/WorkFlowPro.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/WorkFlowPro.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/workflowpro-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/workflowpro-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build Angular production
        run: npm run build

  docker:
    name: Container Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: workflowpro-api:ci-test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/workflowpro-web
          file: ./frontend/workflowpro-web/Dockerfile
          push: false
          tags: workflowpro-web:ci-test
